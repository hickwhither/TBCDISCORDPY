[project]
name = "tbcdiscordpy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord-py[voice]>=2.7.1",
    "dotenv>=0.9.9",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.19.2",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"features/antiraid/service.py" = ["W291"]

[tool.ruff.format]
quote-style = "double"
