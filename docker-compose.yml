version: '3.9'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbcdiscordpy-bot
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Uncomment for development with hot reload
    # volumes:
    #   - ./core:/app/core
    #   - ./features:/app/features
    #   - ./models:/app/models
    #   - ./repository:/app/repository
    #   - ./main.py:/app/main.py
    develop:
      watch:
        - action: sync
          path: ./core
          target: /app/core
        - action: sync
          path: ./features
          target: /app/features
        - action: sync
          path: ./models
          target: /app/models
        - action: sync
          path: ./repository
          target: /app/repository
        - action: sync
          path: ./main.py
          target: /app/main.py
