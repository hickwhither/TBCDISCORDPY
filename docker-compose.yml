services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbcdiscordpy-bot
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
